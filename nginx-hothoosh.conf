# HotHoosh nginx config with NO-CACHE headers
# Prevents Cloudflare and browser caching
# Place at: /etc/nginx/sites-available/hothoosh.ir.conf

server {
    listen 80;
    listen [::]:80;
    server_name hothoosh.ir www.hothoosh.ir;

    # Disable ALL caching - both Cloudflare and browser
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Cache-Status "BYPASS" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # Extra: ensure upstream doesn't send cached responses
        proxy_no_cache 1;
        proxy_set_header Accept-Encoding "";
    }
}
