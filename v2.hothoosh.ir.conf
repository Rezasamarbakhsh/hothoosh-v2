# ==============================================
# HotHoosh v2 - Nginx Config for v2.hothoosh.ir
# ==============================================
# Copy to: /etc/nginx/sites-available/v2.hothoosh.ir
# Then:   sudo ln -s /etc/nginx/sites-available/v2.hothoosh.ir /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare handles SSL (Full Strict mode)
# This nginx just proxies to the Docker container on port 3001
#

server {
    listen 80;
    listen [::]:80;
    server_name v2.hothoosh.ir;

    # If direct access (no Cloudflare), redirect to https
    # (not needed if Cloudflare proxy is always ON)

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}