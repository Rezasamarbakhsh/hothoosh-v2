# HotHoosh v2 - Docker Compose
# Uses host nginx for SSL (Cloudflare) → just exposes app on port 3000

services:
  hothoosh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hothoosh-v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    volumes:
      - hothoosh-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hothoosh-data:
    driver: local